import com.android.build.api.artifact.ArtifactTransformationRequest
import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.BuiltArtifact
import kotlin.jvm.functions.Function1

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.ruon2.app'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ruon2.app"
        minSdk = 25
        targetSdk = 36
        versionCode = 303
        versionName = "3.0.3"
        multiDexEnabled = true

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Release signing is only wired up when app/keystore.properties is present.
        // This keeps a fresh clone (which does not have the secret keystore) building.
        if (hasReleaseKeystore) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }

            debug {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // 16 KB page-size support: keep bundled native libraries (e.g. the
    // libdatastore_shared_counter.so pulled in transitively by Firebase) stored
    // uncompressed and page-aligned so they are loadable on 16 KB devices.
    // useLegacyPackaging=false is the AGP 8 default; set explicitly to prevent regressions.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// Renames each output APK to R-U-On.<versionName>_<versionCode>_<buildType>.apk.
// Migrated from the obsolete `applicationVariants` API (disabled by default in AGP 9,
// removed in AGP 10) to the androidComponents Variant + Artifacts API. SingleArtifact.APK
// is a transformable "contains-many" artifact, so the rename is performed by transforming
// it through a task that copies each built APK to its new name.
androidComponents {
    onVariants(selector().all(), { variant ->
        def renameApk = tasks.register("renameApkFor${variant.name.capitalize()}", RenameApkTask) { task ->
            task.buildTypeName.set(variant.buildType)
        }
        ArtifactTransformationRequest<RenameApkTask> request = variant.artifacts
                .use(renameApk)
                .wiredWithDirectories(
                        { RenameApkTask t -> t.getApkFolder() } as Function1,
                        { RenameApkTask t -> t.getOutputFolder() } as Function1)
                .toTransformMany(SingleArtifact.APK.INSTANCE)
        renameApk.configure { task -> task.transformationRequest.set(request) }
    } as Action)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
