    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}

/**
 * Transforms the packaged APK artifact by copying each built APK to a custom filename:
 * R-U-On.<versionName>_<versionCode>_<buildType>.apk. This is the androidComponents
 * (Artifacts API) replacement for the removed `applicationVariants` output-renaming hook.
 */
abstract class RenameApkTask extends DefaultTask {

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getApkFolder()

    @OutputDirectory
    abstract DirectoryProperty getOutputFolder()

    @Input
    abstract Property<String> getBuildTypeName()

    @Internal
    abstract Property<ArtifactTransformationRequest<RenameApkTask>> getTransformationRequest()

    @TaskAction
    void run() {
        transformationRequest.get().submit(this, { BuiltArtifact builtArtifact ->
            File input = new File(builtArtifact.outputFile)
            String newName = "R-U-On.${builtArtifact.versionName}_${builtArtifact.versionCode}_${buildTypeName.get()}.apk"
            File output = new File(outputFolder.get().asFile, newName)
            Files.copy(input.toPath(), output.toPath(), StandardCopyOption.REPLACE_EXISTING)
            return output
        } as Function1)
    }
}
